networks:
  containet:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    privileged: true
    environment:
      - JELLYFIN_PublishedServerUrl=http://jellyfin.home
      - VIRTUAL_HOST=jellyfin.home
      - VIRTUAL_PORT=8096
    networks:
      - containet
    ports:
      - 8096:8096
    volumes:
      - ./data/jellyfin/config:/config
      - ./external_hdd/data/jellyfin/cache:/cache
      - ./external_hdd/data/ftp/storage/public/downloads/complete/:/media:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined

  wg:
    image: ngoduykhanh/wireguard-ui:latest
    container_name: wgui
    restart: unless-stopped
    environment:
      - WGUI_USERNAME=${USER_ACCOUNT}
      - WGUI_PASSWORD=${PASSWORD}
      - VIRTUAL_HOST=wgui.home
    networks:
      - containet
    volumes:
      - ./data/wireguard_ui:/app/db
      - /etc/wireguard:/etc/wireguard

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=Europe/Bucharest
      - PIHOLE_DNS_=127.0.0.1#5335
      - WEBPASSWORD=${PASSWORD}
      - WEB_PORT=8080
      - VIRTUAL_HOST=pihole.home
      - VIRTUAL_PORT=8080
    network_mode: host
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d

  unbound:
    image: alpinelinux/unbound:latest
    container_name: unbound
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    volumes:
      - ./data/unbound:/etc/unbound/

  certs-generator:
    image: jwilder/docker-gen
    container_name: certs-generator
    restart: unless-stopped
    networks:
      - containet
    command: -watch -only-exposed -notify /certs/generate.sh -notify-container reverse-proxy -notify-signal -1 /etc/docker-gen/templates/certs.tmpl /config/certs.cnf
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/certs-generator/templates:/etc/docker-gen/templates
      - ./data/certs-generator/config:/config
      - ./data/certs:/certs

  reverse-proxy:
    image: nginxproxy/nginx-proxy
    container_name: reverse-proxy
    restart: unless-stopped
    networks:
      - containet
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/certs:/etc/nginx/certs

  flood:
    image: jesec/flood
    container_name: flood
    restart: unless-stopped
    environment:
      - HOME=/config
      - VIRTUAL_HOST=transmission.home
      - VIRTUAL_PORT=3001
    networks:
      - containet
    command: --port 3001
    volumes:
      - ./data/flood:/config

  ftp:
    image: delfer/alpine-ftp-server
    container_name: ftp
    restart: unless-stopped
    environment:
      - USERS=transfer|transfer
      - ADDRESS=10.8.0.1
    ports:
      - 21:21
      - 21000-21010:21000-21010
    networks:
      - containet
    volumes:
      - ./external_hdd/data/ftp/storage:/ftp/transfer

  vaultwarden:
    image: vaultwarden/server
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=vaultwarden.home
      - VIRTUAL_PORT=80
    networks:
      - containet
    volumes:
      - ./data/vaultwarden:/data

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    networks:
      - containet
    ports:
      - 51413:51413
    volumes:
      - ./data/transmission:/config
      - ./external_hdd/data/ftp/storage/public/downloads:/downloads

  openproject:
    image: openproject/community:13
    container_name: openproject
    restart: unless-stopped
    environment:
      - OPENPROJECT_HOST__NAME=project.home
      - OPENPROJECT_SECRET_KEY_BASE=${OPENPROJECT_KEY_BASE}
      - VIRTUAL_HOST=project.home
      - VIRTUAL_PORT=80
    networks:
      - containet
    volumes:
      - ./data/openproject/pgdata:/var/openproject/pgdata
      - ./data/openproject/assets:/var/openproject/assets

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    environment:
      - VIRTUAL_HOST=portainer.home
      - VIRTUAL_PORT=9443
    networks:
      - containet
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
