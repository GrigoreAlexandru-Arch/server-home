version: "2.1"

networks:
  containet:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - JELLYFIN_PublishedServerUrl=http://jellyfin.home
    networks:
      - containet
    volumes:
      - ./data/jellyfin/config:/config
      - ./external_hdd/data/jellyfin/cache:/cache
      - ./external_hdd/data/ftp/storage/public/downloads/complete/:/media:ro

  wg:
    image: ngoduykhanh/wireguard-ui:latest
    container_name: wgui
    restart: unless-stopped
    environment:
      - WGUI_USERNAME=${USER_ACCOUNT}
      - WGUI_PASSWORD=${PASSWORD}
    networks:
      - containet
    volumes:
      - ./data/wireguard_ui:/app/db
      - /etc/wireguard:/etc/wireguard

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    environment:
      - TZ=Europe/Bucharest
      - PIHOLE_DNS_=193.231.252.1;213.154.124.1
      - WEBPASSWORD=${PASSWORD}
      - WEB_PORT=8080
      - FTLCONF_LOCAL_IPV4=10.8.0.1
    network_mode: host
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d

  reverse-proxy:
    image: nginx
    container_name: reverse-proxy
    restart: unless-stopped
    networks:
      - containet
    ports:
      - 80:80
    volumes:
      - ./data/nginx/conf.d:/etc/nginx/conf.d

  flood:
    image: jesec/flood
    container_name: flood
    restart: unless-stopped
    environment:
      - HOME=/config
    networks:
      - containet
    command: --port 3001
    volumes:
      - ./data/flood:/config

  ftp:
    image: delfer/alpine-ftp-server
    container_name: ftp
    restart: unless-stopped
    environment:
      - USERS=transfer|transfer
      - ADDRESS=10.8.0.1
    ports:
      - 21:21
      - 21000-21010:21000-21010
    networks:
      - containet
    volumes:
      - ./external_hdd/data/ftp/storage:/ftp/transfer

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
    networks:
      - containet
    ports:
      - 51413:51413
    volumes:
      - ./data/transmission:/config
      - ./external_hdd/data/ftp/storage/public/downloads:/downloads
