networks:
  containet:
    driver: bridge

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    privileged: true
    user: "1000:1000"
    group_add:
      - "44"
      - "993"
    mem_limit: 2g
    mem_reservation: 1g
    cpus: 4
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy 'localhost' -Lk -fsS \"$${HEALTHCHECK_URL}\" || exit 1"]
      interval: 30s
      timeout: 30s
      start_period: 10s
      retries: 3
    environment:
      - HEALTHCHECK_URL=http://localhost:8096/health
      - JELLYFIN_PublishedServerUrl=http://jellyfin.home
      - VIRTUAL_HOST=jellyfin.home
      - VIRTUAL_PORT=8096
      - CERT_NAME=home
    networks:
      - containet
    ports:
      - 8096:8096
    volumes:
      - ./data/jellyfin/config:/config
      - ./external_hdd/data/jellyfin/cache:/cache
      - ./external_hdd/data/ftp/storage/public/downloads/complete/:/media:ro
    devices:
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
      - /dev/iep
      - /dev/mpp-service
      - /dev/vpu_service
      - /dev/vpu-service
      - /dev/hevc_service
      - /dev/hevc-service
      - /dev/rkvdec
      - /dev/rkvenc
      - /dev/vepu
      - /dev/h265e
    security_opt:
      - systempaths=unconfined
      - apparmor=unconfined

  wg:
    image: ngoduykhanh/wireguard-ui:0.6.2
    container_name: wgui
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 64m
    environment:
      - WGUI_USERNAME=${USER_ACCOUNT}
      - WGUI_PASSWORD=${PASSWORD}
      - VIRTUAL_HOST=wgui.home
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - ./data/wireguard_ui:/app/db
      - /etc/wireguard:/etc/wireguard

  cnames-generator:
    image: jwilder/docker-gen:0.17.2
    container_name: cnames-generator
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"docker-gen\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_reservation: 32m
    restart: unless-stopped
    networks:
      - containet
    command: -watch -notify-container pihole -notify-signal 10 /etc/docker-gen/templates/cname.tmpl /cname_output/cname_output
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/cname/template:/etc/docker-gen/templates
      - ./data/cname/output:/cname_output

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: pihole
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "dig -p $(pihole-FTL --config dns.port) +short +norecurse +retry=0 @127.0.0.1 pi.hole || exit 1"]
    environment:
      - TZ=Europe/Bucharest
      - FTLCONF_dns_upstreams=unbound
      - FTLCONF_webserver_api_password=${PASSWORD}
      - PIHOLE_API_PASSWORD=${PASSWORD}
      - FTLCONF_webserver_port=80
      - FTLCONF_dns_listeningMode=ALL
      - FTLCONF_dns_hostRecord=server.home,10.8.0.1
      - FTLCONF_dns_hosts=10.8.0.2 laptop.home;10.8.0.9 pc.home
      - FTLCONF_dns_domain_name=home
      - FTLCONF_misc_privacyLevel=3
      - VIRTUAL_HOST=pihole.home
      - VIRTUAL_PORT=80
      - CERT_NAME=home
    networks:
      - containet
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d
      - ./data/cname/output:/cname_output
      - ./data/pihole-dyn:/pihole-dyn
    cap_add:
      - SYS_NICE
    entrypoint: ["/bin/bash", "/pihole-dyn/pihole-wrapper.sh"]

  unbound:
    image: alpinelinux/unbound@sha256:3faee768f01493d8bda49e7815923b6c2036640da81ef6aa472c369922a913dc
    container_name: unbound
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x unbound > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 128m
    mem_reservation: 64m
    networks:
      - containet
    volumes:
      - ./data/unbound:/etc/unbound/

  certs-generator:
    image: jwilder/docker-gen:0.17.2
    container_name: certs-generator
    restart: unless-stopped
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"docker-gen\" ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_reservation: 32m
    networks:
      - containet
    command: -watch -notify /certs/generate.sh /etc/docker-gen/templates/certs.tmpl /config/certs.cnf
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/certs-generator/templates:/etc/docker-gen/templates
      - ./data/certs-generator/config:/config
      - ./data/certs:/certs

  reverse-proxy:
    image: nginxproxy/nginx-proxy:1.11.6
    container_name: reverse-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "-o", "/dev/null", "-H", "Host: pihole.home", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    mem_reservation: 128m
    networks:
      - containet
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./data/certs:/etc/nginx/certs
      - ./data/reverse-proxy:/etc/nginx/vhost.d

  cert-reloader:
    build: ./data/cert-reloader
    image: cert-reloader:1.0.0
    container_name: cert-reloader
    restart: unless-stopped
    mem_limit: 64m
    mem_reservation: 32m
    healthcheck:
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm)\" = \"node\" ] && [ -S /var/run/docker.sock ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - containet
    volumes:
      # RW on purpose: this container issues `docker exec` into reverse-proxy
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/certs:/certs

  filebrowser:
    image: gtstef/filebrowser:1.5.2-stable-slim
    container_name: filebrowser
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${PASSWORD}
      - VIRTUAL_HOST=files.home
      - VIRTUAL_PORT=80
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - ./data/filebrowser:/home/filebrowser/data
      - ./external_hdd/data/ftp/storage:/srv

  hermes-proxy:
    image: nginx:1.31.3-alpine
    container_name: hermes-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 64m
    mem_reservation: 32m
    networks:
      - containet
    environment:
      - VIRTUAL_HOST=hermes.home
      - VIRTUAL_PORT=80
      - CERT_NAME=home
    volumes:
      - ./data/hermes-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  vaultwarden:
    image: vaultwarden/server:1.37.1
    container_name: vaultwarden
    restart: unless-stopped
    user: "1000:1000"
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
    environment:
      - DOMAIN=https://vaultwarden.home
      - VIRTUAL_HOST=vaultwarden.home
      - VIRTUAL_PORT=80
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - ./data/vaultwarden:/data

  transmission:
    image: lscr.io/linuxserver/transmission:4.1.3
    container_name: transmission
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9091/transmission/rpc"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - USER=${USER_ACCOUNT}
      - PASS=${PASSWORD}
      - DOCKER_MODS=linuxserver/mods:transmission-floodui
      - VIRTUAL_HOST=transmission.home
      - VIRTUAL_PORT=9091
      - CERT_NAME=home
    networks:
      - containet
    ports:
      - 51413:51413
    volumes:
      - ./data/transmission:/config
      - ./external_hdd/data/ftp/storage/public/downloads:/downloads

  portainer:
    image: portainer/portainer-ce:2.44.0
    container_name: portainer
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      - VIRTUAL_HOST=portainer.home
      - VIRTUAL_PORT=9000
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data

  duplicati:
    image: duplicati/duplicati:2.3.0.4
    container_name: duplicati
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8200'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    mem_reservation: 256m
    environment:
      - DUPLICATI__WEBSERVICE_PASSWORD=${PASSWORD}
      - DUPLICATI__WEBSERVICE_ALLOWED_HOSTNAMES=duplicati.home
      - VIRTUAL_HOST=duplicati.home
      - VIRTUAL_PORT=8200
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - ./data:/data

  dozzle:
    image: amir20/dozzle:v10.7.1
    container_name: dozzle
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 64m
    mem_reservation: 32m
    networks:
      - containet
    environment:
      - VIRTUAL_HOST=dozzle.home
      - VIRTUAL_PORT=8080
      - CERT_NAME=home
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    restart: unless-stopped
    hostname: server-home-syncthing
    mem_limit: 256m
    mem_reservation: 128m
    healthcheck:
      test: ["CMD-SHELL", "curl -fkLsS -m 2 127.0.0.1:8384/rest/noauth/health | grep -o --color=never OK || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - PUID=1000
      - PGID=1000
      - SYNCTHING_GUI_USER=admin
      - SYNCTHING_GUI_PASSWORD=${PASSWORD}
      - SYNCTHING_FOLDERS=obsidian:/var/syncthing/obsidian
      - VIRTUAL_HOST=syncthing.home
      - VIRTUAL_PORT=8384
      - CERT_NAME=home
    networks:
      - containet
    ports:
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    volumes:
      - ./data/syncthing:/var/syncthing/config
      - ./data/obsidian:/var/syncthing/obsidian
      - ./data/syncthing/entrypoint.sh:/entrypoint.sh:ro

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.0.0
    container_name: homepage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=home.home
      - HOMEPAGE_AUTH_ENABLED=true
      - HOMEPAGE_AUTH_SECRET=${HOMEPAGE_AUTH_SECRET}
      - HOMEPAGE_AUTH_PASSWORD=${PASSWORD}
      - HOMEPAGE_EXTERNAL_URL=https://home.home
      - HOMEPAGE_VAR_USER=${USER_ACCOUNT}
      - HOMEPAGE_VAR_PASSWORD=${PASSWORD}
      - HOMEPAGE_VAR_SYNCTHING_APIKEY=${SYNCTHING_APIKEY}
      - VIRTUAL_HOST=home.home
      - VIRTUAL_PORT=3000
      - CERT_NAME=home
    networks:
      - containet
    volumes:
      - ./data/homepage:/app/config
      - ./data/homepage/public/images:/app/public/images
      - /var/run/docker.sock:/var/run/docker.sock:ro
  pc-access:
    build: ./data/pc-gate
    image: pc-access:0.1.0
    container_name: pc-access
    restart: unless-stopped
    mem_limit: 128m
    mem_reservation: 64m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8123'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - PC_HOST=${PC_HOST:-mihai@pc.home}
      - PORT=8123
      - GATE_KEY=/data/pc-gate/gate_key
      - STAGING_DIR=/transfer
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./data/pc-gate/keys:/data/pc-gate
      - ./data/pc-gate/staging:/transfer
