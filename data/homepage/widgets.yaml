---
# Info widgets (top of page).
# The Docker panel (from docker.yaml) carries the real per-service CPU/Mem/Net.
- resources:
    cpu: true
    memory: true
    uptime: true
    disk: /
    units: metric
- openmeteo:
    # No latitude/longitude -> widget uses the browser's current location (HTTPS).
    units: metric
    cache: 5
