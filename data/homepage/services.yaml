- Media & Files:
    - Jellyfin:
        icon: /images/icons/jellyfin.svg
        href: https://jellyfin.home
        description: Media server
        server: server-home
        container: jellyfin
    - Transmission:
        icon: /images/icons/transmission.svg
        href: https://transmission.home
        description: Torrent client
        server: server-home
        container: transmission
        widget:
          type: transmission
          url: http://transmission:9091
          username: {{HOMEPAGE_VAR_USER}}
          password: {{HOMEPAGE_VAR_PASSWORD}}
          rpcUrl: /transmission/
    - FileBrowser:
        icon: /images/icons/filebrowser.svg
        href: https://files.home
        description: File transfer
        server: server-home
        container: filebrowser
    - Syncthing:
        icon: /images/icons/syncthing.svg
        href: https://syncthing.home
        description: File sync
        server: server-home
        container: syncthing
        widget:
          type: syncthing
          url: http://syncthing:8384
          key: {{HOMEPAGE_VAR_SYNCTHING_APIKEY}}
- Security & Network:
    - Vaultwarden:
        icon: /images/icons/vaultwarden.svg
        href: https://vaultwarden.home
        description: Password manager
        server: server-home
        container: vaultwarden
    - Pi-hole:
        icon: /images/icons/pihole.svg
        href: https://pihole.home
        description: Ad blocker / DNS
        server: server-home
        container: pihole
        widget:
          type: pihole
          url: http://pihole:80
          version: 6
          key: {{HOMEPAGE_VAR_PASSWORD}}
    - WireGuard UI:
        icon: /images/icons/wireguard.svg
        href: https://wgui.home
        description: VPN management
        server: server-home
        container: wgui
- Admin & Tools:
    - Portainer:
        icon: /images/icons/portainer.svg
        href: https://portainer.home
        description: Container management
        server: server-home
        container: portainer
    - Duplicati:
        icon: /images/icons/duplicati.svg
        href: https://duplicati.home
        description: Backups
        server: server-home
        container: duplicati
    - Dozzle:
        icon: /images/icons/dozzle.svg
        href: https://dozzle.home
        description: Log viewer
        server: server-home
        container: dozzle
    - Hermes:
        icon: /images/icons/hermes.svg
        href: https://hermes.home
        description: AI assistant
        server: server-home
        container: hermes-proxy
