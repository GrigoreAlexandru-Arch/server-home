server {
    listen 80;

    # Voice uploads (WAV recordings) can exceed nginx's 1M default; the outer
    # reverse-proxy already allows 100M, so match it here or bodies die at this hop.
    client_max_body_size 100m;

    location / {
        proxy_pass http://172.18.0.1:9119;
        # ASR transcription of long clips legitimately takes minutes; the default
        # 60s read timeout turned those into 504s at the outer hop.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}