# Honcho — self-hosted with configurable LLM providers
#
# Data sovereignty: all memory/state stays on this VM (PostgreSQL + Redis).
#
# PROVIDER STRATEGY:
#   Single OpenAI-compatible provider: OpenRouter, via `transport = "openai"`.
#   There is NO "vllm" transport in this codebase (ModelTransport ∈
#   openai|anthropic|gemini); OpenRouter is an OpenAI-compatible API.
#   The API key is injected via LLM_OPENAI_API_KEY env (compose), never here.
#
# MODEL ROUTING (per Alex, 2026-10-08) — split by latency sensitivity, not cost.
#   Rule: anything latency-bound AND not complex runs gpt-4.1-nano.
#   FAST / latency-bound   → openai/gpt-4.1-nano (NON-reasoning, $0.10/$0.40,
#     1M ctx, tools + structured outputs). Two roles sit on a live budget:
#       - deriver   : runs on EVERY message.
#       - dialectic : peer.chat, bounded by the Hermes client's 30s HTTP timeout.
#     Dialectic moved deepseek-v4-flash-0731 → nano on 2026-10-08: every call ran
#     44–130s against a 30s client timeout, so 100% were discarded after the
#     backend had already billed them. Non-thinking also removes the
#     empty-JSON-under-reasoning-budget failure mode at the source.
#   COMPLEX / out of band   → deepseek/deepseek-v4-flash-0731 (reasoning, 1.31M
#     ctx). Summary, dream and deduction/induction are async and benefit from
#     reasoning; latency there is not user-facing.
#   NOTE: the deriver-side reasoning mitigations (max_output_tokens 8192,
#     thinking_budget_tokens 2048) existed ONLY because 0731 is a reasoning
#     model. gpt-4.1-nano does not reason, so that override was dropped.

[app]
LOG_LEVEL = "INFO"
SESSION_OBSERVERS_LIMIT = 10
GET_CONTEXT_MAX_TOKENS = 100000
MAX_FILE_SIZE = 5242880
MAX_MESSAGE_SIZE = 25000
EMBED_MESSAGES = true
MAX_EMBEDDING_TOKENS = 8192
NAMESPACE = "honcho"

[db]
CONNECTION_URI = "postgresql+psycopg://honcho:honcho@database:5432/honcho"
SCHEMA = "public"
POOL_SIZE = 10
MAX_OVERFLOW = 20
POOL_TIMEOUT = 30
POOL_RECYCLE = 300

[auth]
USE_AUTH = false

[cache]
ENABLED = true
URL = "redis://redis:6379/0?suppress=true"
DEFAULT_TTL_SECONDS = 300

# ---------------------------------------------------------------------------
# LLM provider — OpenAI-compatible, OpenRouter.
#   Key supplied via LLM_OPENAI_API_KEY env; base URL here (or LLM_OPENAI_BASE_URL).
# ---------------------------------------------------------------------------
[llm]
DEFAULT_MAX_TOKENS = 4096 
EMBEDDING_PROVIDER = "openrouter"

# ---------------------------------------------------------------------------
# Embeddings — same OpenRouter endpoint. Key falls back to LLM.OPENAI_API_KEY.
# ---------------------------------------------------------------------------
[embedding]
VECTOR_DIMENSIONS = 1536
MAX_INPUT_TOKENS = 8192

[embedding.model_config]
transport = "openai"
model = "text-embedding-3-small"

[embedding.model_config.overrides]
base_url = "https://openrouter.ai/api/v1"

# ---------------------------------------------------------------------------
# Deriver — observation extraction (runs every message, needs speed + tools)
# ---------------------------------------------------------------------------
[deriver]
ENABLED = true
WORKERS = 1
POLLING_SLEEP_INTERVAL_SECONDS = 1.0
STALE_SESSION_TIMEOUT_MINUTES = 5

DEDUPLICATE = true
MAX_OUTPUT_TOKENS = 4096
MAX_INPUT_TOKENS = 23000
WORKING_REPRESENTATION_MAX_OBSERVATIONS = 100
REPRESENTATION_BATCH_TARGET_INPUT_TOKENS = 1024
FLUSH_ENABLED = false

[deriver.model_config]
transport = "openai"
# NON-reasoning: this role fires on every inbound message, so speed wins here.
# gpt-4.1-nano emits no thinking tokens (no reasoning-budget burn, no EMPTY-JSON
# cap failure). Switched from deepseek-v4-flash-0731 on 2026-10-08.
model = "openai/gpt-4.1-nano"
# Plain headroom for the observation JSON — no reasoning reservation needed.
max_output_tokens = 8192

# ---------------------------------------------------------------------------
# Dialectic — multi-level reasoning for peer.chat
#   LATENCY-BOUND: the Hermes client aborts peer.chat at the 30s default HTTP
#   timeout, so this runs on nano (moved off deepseek-v4-flash-0731 on
#   2026-10-08 — every call exceeded 30s and was discarded).
# ---------------------------------------------------------------------------
[dialectic]
MAX_OUTPUT_TOKENS = 8192
MAX_INPUT_TOKENS = 100000
HISTORY_TOKEN_LIMIT = 8192
SESSION_HISTORY_MAX_TOKENS = 2048

[dialectic.levels.minimal.model_config]
transport = "openai"
model = "openai/gpt-4.1-nano"

[dialectic.levels.minimal]
MAX_TOOL_ITERATIONS = 1
MAX_OUTPUT_TOKENS = 512

[dialectic.levels.low.model_config]
transport = "openai"
model = "openai/gpt-4.1-nano"

[dialectic.levels.low]
MAX_TOOL_ITERATIONS = 2

[dialectic.levels.medium.model_config]
transport = "openai"
model = "openai/gpt-4.1-nano"

[dialectic.levels.medium]
MAX_TOOL_ITERATIONS = 2

[dialectic.levels.high.model_config]
transport = "openai"
model = "openai/gpt-4.1-nano"

[dialectic.levels.high]
MAX_TOOL_ITERATIONS = 3

[dialectic.levels.max.model_config]
transport = "openai"
model = "openai/gpt-4.1-nano"

[dialectic.levels.max]
MAX_TOOL_ITERATIONS = 3

# ---------------------------------------------------------------------------
# Summary — session summarization (async, not latency-bound)
# ---------------------------------------------------------------------------
[summary]
ENABLED = true
MESSAGES_PER_SHORT_SUMMARY = 20
MESSAGES_PER_LONG_SUMMARY = 60

MAX_TOKENS_SHORT = 1000
MAX_TOKENS_LONG = 4000

[summary.model_config]
transport = "openai"
model = "deepseek/deepseek-v4-flash-0731"

# ---------------------------------------------------------------------------
# Dream — memory consolidation (runs rarely, needs best quality)
# ---------------------------------------------------------------------------
[dream]
ENABLED = true
DOCUMENT_THRESHOLD = 50
IDLE_TIMEOUT_MINUTES = 60
MIN_HOURS_BETWEEN_DREAMS = 8
ENABLED_TYPES = ["omni"]

MAX_OUTPUT_TOKENS = 16384
MAX_TOOL_ITERATIONS = 20
HISTORY_TOKEN_LIMIT = 16384

[dream.deduction_model_config]
transport = "openai"
model = "deepseek/deepseek-v4-flash-0731"

[dream.induction_model_config]
transport = "openai"
model = "deepseek/deepseek-v4-flash-0731"

[peer_card]
ENABLED = true

[vector_store]
TYPE = "pgvector"

[metrics]
ENABLED = false

[telemetry]
ENABLED = false

[sentry]
ENABLED = false
