apiVersion: 1

datasources:
  # Metrics — VictoriaMetrics speaks the Prometheus API natively.
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoria-metrics:8428
    isDefault: true
    jsonData:
      httpMethod: POST

  # Traces — VictoriaTraces exposes a Jaeger-compatible query API.
  - name: VictoriaTraces
    type: jaeger
    access: proxy
    uid: victoriatraces
    url: http://victoria-traces:10428/select/jaeger

  # Logs — needs the VictoriaLogs datasource plugin (GF_INSTALL_PLUGINS).
  - name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    uid: victorialogs
    url: http://victoria-logs:9428
